<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postres Gemelas</title>
    <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        crossorigin="crossorigin" as="font">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">


</head>

<body>
    <header class="header">
        <div class="contenedor">
            <div class="barra">
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre centrar-texto no-margin">Postres <span class="logo__bold">Gemelas</span>
                    </h1>
                </a>

                <div class="mobile-menu">
                    <img src="img/iconoBarras.png" alt="icono menu" id="boton-menu">
                </div>

                <nav class="navegacion" id="navegacion">
                    <div class="cerrar-menu">
                        <span id="btn-cerrar">X</span>
                    </div>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>

                <div id="overlay" class="overlay"></div>
            </div>
        </div>

        <div class="header__texto">
            <h1 class="no-margin">Postres, Alitas y más...</h1>
            <h3 class="no-margin">Más de 10 años endulzando tus momentos y conquistando tu paladar.</h3>

        </div>
    </header>

    <main class="contenedor">
        <h1>Explora Nuestro Menú</h1>

        <div class="grid">
            <div class="producto">
                <a href="frito.html">
                    <img class="producto__imagen" src="img/Alitas.png" alt="imagen alitas">
                    <h2 class="producto__nombre entrada">Alitas & más</h2>
                </a>
            </div>

            <div class="producto">
                <a href="pasteles.html">
                    <img class="producto__imagen" src="img/Pastel.jpg" alt="imagen pasteles">
                    <h2 class="producto__nombre entrada">Pasteles & más</h2>
                </a>
            </div>

            <div class="producto">
                <a href="crepa.html">
                    <img class="producto__imagen" src="img/crepa.jpg" alt="imagen crepas">
                    <h2 class="producto__nombre entrada">Crepas & Waffles</h2>
                </a>
            </div>

            <div class="producto">
                <a href="hamburguesas.html">
                    <img class="producto__imagen" src="img/Hamburguesas.png" alt="imagen hamburguesas">
                    <h2 class="producto__nombre entrada">Hamburguesas</h2>
                </a>
            </div>

            <div class="producto">
                <a href="hotdogs.html">
                    <img class="producto__imagen" src="img/hot-dogs.png" alt="imagen hot-dogs">
                    <h2 class="producto__nombre entrada">Hot-Dogs</h2>
                </a>
            </div>

            <div class="producto">
                <a href="frappes.html">
                    <img class="producto__imagen" src="img/frappes.png" alt="imagen frappes">
                    <h2 class="producto__nombre entrada">Frappes</h2>
                </a>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="contenedor">
            <div class="barra">
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre centrar-texto no margin">Postres<span
                            class="logo__bold no-margin">Gemelas</span></h1>
                </a>

            </div>
        </div>
    </footer>
    
    <button id="btn-subir" class="btn-subir" title="Ir al inicio">
    <img src="img/iconoFlecha.png" alt="Subir"> </button>
    <script src="navegacion.js"></script>
</body>

</html>
